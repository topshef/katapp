<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>KEA Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="kea.css">

  <script src="https://kpay.uk/assets/js/darkmode.js?v=0.2"></script>
</head>

<body>
  <header class="app-header">
    <div>
      <h1>🦜 KEA</h1>
      <p class="subtitle">Approval agent. Watch trader intent keys, fetch approval packages, check the promise matches the action.</p>
    </div>

    <div class="toolbar">
      <button id="scanQrBtn" class="primary">📷 Scan QR</button>
      <button id="toolsBtn" title="Debug tools">⚙️ Tools</button>
      <button id="stopQrBtn" class="quiet" style="display:none">Stop camera</button>
    </div>
  </header>

  <div id="status" class="status-line">Ready.</div>
  <input id="qrFile" type="file" accept="image/*" capture="environment" style="display:none">
  <video id="qrVideo" playsinline></video>

  <section>
    <h2>Watches</h2>
    <div id="watches" class="panel table-wrap"></div>
  </section>

  <section>
    <h2>Events</h2>
    <div id="events" class="panel table-wrap"></div>
  </section>

  <dialog id="watchModal">
    <div class="modal-head">
      <div id="watchModalTitle" class="modal-title">⚙️ Add debug watch</div>
      <button id="watchModalCloseBtn">Close</button>
    </div>

    <div class="modal-body">
      <p class="debug-note">Normal flow is scan QR. These fields are for local testing, editing a watch, or pasting a QR/link manually.</p>

      <div class="row">
        <button id="pasteQrBtn">Paste QR link</button>
      </div>

      <label>Display name</label>
      <input id="watchName" placeholder="Optional, e.g. Tim the Trader">

      <label>KPool base URL</label>
      <input id="baseUrl" value="https://hapi5.katomia.com">

      <label>WebSocket URL</label>
      <input id="wsUrl" value="wss://hapi5.katomia.com/ws">

      <label>Network</label>
      <input id="network" value="mainnet">

      <label>Game ID</label>
      <input id="scopeGameId" value="m-order">

      <label>Trader intent public key to watch</label>
      <input id="orderPubkey" value="" class="mono">

      <label>Mode</label>
      <select id="watchMode">
        <option value="doorbell">Doorbell only</option>
        <option value="fetch" selected>Doorbell + fetch/check</option>
        <option value="sign">Doorbell + fetch/check + sign later</option>
      </select>

      <div class="modal-actions">
        <button id="resetBtn" class="danger">Reset local KEA data</button>
        <button id="cancelWatchBtn">Cancel</button>
        <button id="saveWatchBtn" class="primary">Add watch</button>
      </div>
    </div>
  </dialog>

  <dialog id="detailModal">
    <div class="modal-head">
      <div id="detailModalTitle" class="modal-title">Detail</div>
      <button id="detailModalCloseBtn">Close</button>
    </div>
    <div id="detailModalBody" class="modal-body"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script type="module">
    /*
      KEA one-file prototype JS.

      Later split target:
      - kea-model.js       state, storage, normalisation
      - kea-view.js        rendering, modals, DOM helpers
      - kea-watch.js       watch CRUD and WebSocket doorbells
      - kea-qr.js          QR scan/paste/photo import
      - kea-verify.js      KEA package verification
      - kea-app.js         bootstrap and event wiring
    */

    import * as ed from "https://esm.sh/@noble/ed25519@2.1.0"
    import { sha512 } from "https://esm.sh/@noble/hashes@1.4.0/sha512"
    import { sha256 } from "https://esm.sh/@noble/hashes@1.4.0/sha256"

    ed.etc.sha512Sync = function(...m) { return sha512(ed.etc.concatBytes(...m)) }

    // -------------------------------------------------------------------------
    // MODEL: app state, local persistence, normalisation
    // -------------------------------------------------------------------------

    const WATCHES_KEY = 'keaWatches.v1'
    const events = []
    const sockets = {}

    let watches = []
    let qrStream = null
    let qrScanning = false
    let editingWatchId = null

    function loadWatches() {
      try { watches = JSON.parse(localStorage[WATCHES_KEY] || '[]') } catch { watches = [] }
      watches = watches.map(normaliseWatch)
    }

    function saveWatches() {
      localStorage[WATCHES_KEY] = JSON.stringify(watches.map(stripWatchRuntime))
    }

    function normaliseWatch(w) {
      return {
        id: w.id || makeId(),
        name: String(w.name || '').trim(),
        baseUrl: cleanUrl(w.baseUrl || 'https://hapi5.katomia.com'),
        wsUrl: cleanUrl(w.wsUrl || 'wss://hapi5.katomia.com/ws'),
        network: String(w.network || 'mainnet').trim(),
        gameId: String(w.gameId || '').trim(),
        orderPubkey: String(w.orderPubkey || '').trim().toLowerCase(),
        mode: w.mode || 'fetch',
        paused: !!w.paused,
        status: w.paused ? 'paused' : (w.status || 'idle'),
        note: w.note || '',
        createdAt: w.createdAt || Date.now(),
        lastSeenAt: w.lastSeenAt || null
      }
    }

    function stripWatchRuntime(w) {
      return {
        id: w.id,
        name: w.name,
        baseUrl: w.baseUrl,
        wsUrl: w.wsUrl,
        network: w.network,
        gameId: w.gameId,
        orderPubkey: w.orderPubkey,
        mode: w.mode,
        paused: w.paused,
        note: w.note,
        createdAt: w.createdAt,
        lastSeenAt: w.lastSeenAt
      }
    }

    function getWatch(id) {
      return watches.find(function(w) { return w.id === id })
    }

    function watchFromForm() {
      return normaliseWatch({
        id: editingWatchId || undefined,
        name: $('watchName').value,
        baseUrl: $('baseUrl').value,
        wsUrl: $('wsUrl').value,
        network: $('network').value,
        gameId: $('scopeGameId').value,
        orderPubkey: $('orderPubkey').value,
        mode: $('watchMode').value
      })
    }

    function eventKey(e) {
      return `${e.watchId || 'manual'};${e.network};${e.txid};${e.pch}`
    }

    function addEvent(w, msg) {
      const base = {
        watchId: w.id,
        watchLabel: watchLabel(w),
        network: msg.network || w.network,
        txid: msg.txid,
        pch: msg.pch,
        mode: w.mode,
        status: 'doorbell',
        check: 'pending',
        summary: 'Doorbell received',
        createdAt: Date.now(),
        rawDoorbell: msg
      }

      const key = eventKey(base)
      let e = events.find(function(x) { return x.key === key })

      if (!e) {
        e = { key, ...base }
        events.unshift(e)
      } else {
        Object.assign(e, base, { key })
      }

      renderEvents()
      return e
    }

    function eventDetail(e) {
      return {
        key: e.key,
        watchId: e.watchId,
        watchLabel: e.watchLabel,
        network: e.network,
        txid: e.txid,
        pch: e.pch,
        mode: e.mode,
        status: e.status,
        check: e.check,
        summary: e.summary,
        fetch: e.fetch || null,
        verification: e.verification || null,
        debug: e.debug || null,
        kea: e.kea || null,
        raw: e.raw || null,
        rawDoorbell: e.rawDoorbell || null
      }
    }

    // -------------------------------------------------------------------------
    // CONTROLLER: watch CRUD and WebSocket doorbells
    // -------------------------------------------------------------------------

    function saveWatchFromForm() {
      const watch = watchFromForm()
      validateWatch(watch)

      if (editingWatchId) {
        updateExistingWatch(watch)
        closeWatchModal()
        setStatus(`Saved watch ${watchLabel(watch)}`)
        return
      }

      addWatch(watch)
      closeWatchModal()
    }

    function validateWatch(watch) {
      if (!watch.wsUrl) throw new Error('Missing WebSocket URL')
      if (!watch.baseUrl) throw new Error('Missing KPool base URL')
      if (!watch.network) throw new Error('Missing network')
      if (!watch.orderPubkey) throw new Error('Missing trader intent public key')
    }

    function addWatch(watch) {
      watch = normaliseWatch(watch)
      validateWatch(watch)

      const existing = watches.find(function(w) {
        return w.wsUrl === watch.wsUrl &&
          w.network === watch.network &&
          w.gameId === watch.gameId &&
          w.orderPubkey === watch.orderPubkey
      })

      if (existing) {
        Object.assign(existing, watch, { id: existing.id, paused: false, status: 'idle' })
        watch = existing
      } else {
        watches.unshift(watch)
      }

      saveWatches()
      renderWatches()
      connectWatch(watch)
      setStatus(`Added watch ${watchLabel(watch)}`)
    }

    function updateExistingWatch(next) {
      const old = getWatch(editingWatchId)
      if (!old) throw new Error('Watch no longer exists')

      const wasPaused = old.paused
      const createdAt = old.createdAt

      disconnectWatch(old.id)
      Object.assign(old, next, {
        id: old.id,
        paused: wasPaused,
        createdAt,
        status: wasPaused ? 'paused' : 'idle',
        lastSeenAt: old.lastSeenAt || null
      })

      saveWatches()
      renderWatches()
      if (!old.paused) connectWatch(old)
    }

    function removeWatch(id) {
      disconnectWatch(id)
      watches = watches.filter(function(w) { return w.id !== id })
      saveWatches()
      renderWatches()
      setStatus('Watch removed')
    }

    function toggleWatchPaused(id) {
      const w = getWatch(id)
      if (!w) return

      w.paused = !w.paused
      w.status = w.paused ? 'paused' : 'idle'

      if (w.paused) disconnectWatch(id)
      else connectWatch(w)

      saveWatches()
      renderWatches()
      setStatus(`${w.paused ? 'Paused' : 'Resumed'} ${watchLabel(w)}`)
    }

    function updateWatch(id, changes) {
      const w = getWatch(id)
      if (!w) return
      Object.assign(w, changes)
      saveWatches()
      renderWatches()
    }

    function connectAllWatches() {
      for (const w of watches)
        if (!w.paused) connectWatch(w)
    }

    function connectWatch(w) {
      if (!w || w.paused) return

      const existing = sockets[w.id]
      if (existing && (existing.readyState === WebSocket.OPEN || existing.readyState === WebSocket.CONNECTING)) return

      updateWatch(w.id, { status: 'connecting', note: '' })

      const ws = new WebSocket(w.wsUrl)
      sockets[w.id] = ws

      ws.onopen = function() {
        updateWatch(w.id, { status: 'connected', note: '' })

        ws.send(JSON.stringify({
          type: 'kpool_watch',
          filter: {
            mode: 'kea',
            network: w.network,
            orderPubkey: w.orderPubkey
          }
        }))

        setStatus(`Connected ${watchLabel(w)}`)
      }

      ws.onmessage = function(ev) {
        let msg
        try { msg = JSON.parse(ev.data) } catch { return }

        if (msg.type === 'kea_request') {
          handleDoorbell(w, msg)
          return
        }

        console.debug('KEA socket message', watchLabel(w), msg)
      }

      ws.onclose = function() {
        if (sockets[w.id] === ws) delete sockets[w.id]
        const current = getWatch(w.id)
        if (!current) return
        if (!current.paused) updateWatch(w.id, { status: 'disconnected' })
      }

      ws.onerror = function() {
        updateWatch(w.id, { status: 'error', note: 'doorbell socket error' })
        setStatus(`Socket error on ${watchLabel(w)}`, 'bad')
      }
    }

    function disconnectWatch(id) {
      const ws = sockets[id]
      if (!ws) return
      delete sockets[id]
      try { ws.close() } catch {}
    }

    function handleDoorbell(w, msg) {
      w.lastSeenAt = Date.now()
      saveWatches()

      const e = addEvent(w, msg)
      setStatus(`Doorbell ${shortHash(e.pch)}`)

      if (w.mode === 'doorbell') {
        e.summary = 'Doorbell only'
        e.check = 'not checked'
        renderEvents()
        return
      }

      fetchTxDetail(e).catch(function(err) {
        e.status = 'fetch error'
        e.check = 'fail'
        e.summary = err.message
        e.fetch = Object.assign(e.fetch || {}, { error: err.message })
        renderEvents()
        setStatus(`Fetch error: ${err.message}`, 'bad')
      })
    }

    // -------------------------------------------------------------------------
    // CONTROLLER: fetch and verification
    // -------------------------------------------------------------------------

    async function fetchTxDetail(e) {
      const w = getWatch(e.watchId) || watchFromForm()
      const url = `${cleanUrl(w.baseUrl)}/kpool/txRead?network=${encodeURIComponent(e.network)}&txid=${encodeURIComponent(e.txid)}&pch=${encodeURIComponent(e.pch)}&detail=1&mirror=0`

      e.status = 'fetching'
      e.check = 'pending'
      e.summary = 'Fetching approval package'
      e.fetch = { url, requestedAt: new Date().toISOString() }
      renderEvents()

      const res = await fetch(url)
      const data = await res.json()
      const out = data.result || data

      e.fetch = {
        url,
        ok: res.ok,
        status: res.status,
        statusText: res.statusText,
        fetchedAt: new Date().toISOString()
      }

      e.status = 'fetched'
      e.raw = out
      e.kea = out.kea || null
      e.debug = buildEventDebug(e, w, out.kea || null)

      if (!out.kea) {
        e.check = 'fail'
        e.summary = out.keaError || 'No KEA detail in fetched package'
        renderEvents()
        return
      }

      const result = await verifyKeaForWatch(out.kea, w)
      e.check = result.ok ? 'pass' : 'fail'
      e.summary = result.msg
      e.verification = result
      e.debug = buildEventDebug(e, w, out.kea || null)

      if (result.ok && w.mode === 'sign')
        e.summary = `${e.summary}; signing not wired yet`

      renderEvents()
      setStatus(result.ok ? `Checked ${shortHash(e.pch)} OK` : `Check failed: ${result.msg}`, result.ok ? 'ok' : 'bad')
    }

    function buildEventDebug(e, w, kea) {
      const mandates = kea?.mandates || []
      const fills = getExecutionFills(kea || {})
      const watchedKey = String(w?.orderPubkey || '').toLowerCase()

      return {
        watch: {
          watchId: e.watchId,
          label: e.watchLabel,
          network: w?.network || e.network,
          gameId: w?.gameId || '',
          orderPubkey: shortKey(watchedKey)
        },
        event: {
          txid: e.txid,
          pch: e.pch,
          pchShort: shortHash(e.pch)
        },
        fetched: {
          txid: kea?.transaction?.txid || null,
          pch: kea?.transaction?.pch || null,
          pchShort: shortHash(kea?.transaction?.pch),
          pchMatchesEvent: !!e.pch && !!kea?.transaction?.pch && String(kea.transaction.pch).startsWith(String(e.pch))
        },
        execution: fills.map(function(fill) {
          return {
            fillId: fill.fillId,
            legs: (fill.legs || []).map(function(l) { return String(l.orderId || '') }),
            trigger: fill.trigger != null ? String(fill.trigger) : null
          }
        }),
        mandates: mandates.map(function(m) {
          return {
            orderId: String(m.orderId || ''),
            role: getMandateRole(m, fills),
            intentPubkey: shortKey(m.intentPubkey),
            matchesWatch: String(m.intentPubkey || '').toLowerCase() === watchedKey,
            accountIds: [...new Set((m.bundle || []).map(function(x) { return x.accountId }).filter(Boolean))]
          }
        }),
        watchedOrderIds: mandates
          .filter(function(m) { return String(m.intentPubkey || '').toLowerCase() === watchedKey })
          .map(function(m) { return String(m.orderId || '') })
      }
    }

    // Display-only. There is no maker/taker in a general N-party match.
    // An order is a participant in a clearing event. The only soft label kept
    // here is whether it was the advisory trigger.
    function getMandateRole(mandate, fills) {
      const orderId = String(mandate?.orderId || '')
      let participates = false

      for (const fill of fills) {
        const inFill = (fill.legs || []).some(function(l) { return String(l.orderId || '') === orderId })
        if (!inFill) continue
        if (String(fill.trigger || '') === orderId) return 'trigger'
        participates = true
      }

      return participates ? 'resting' : ''
    }

    async function verifyKeaForWatch(kea, w) {
      try {
        await verifyKeaDetail(kea, {
          network: w.network,
          gameId: w.gameId,
          orderPubkey: w.orderPubkey
        })

        const msg = getKeaSummary(kea)
        return { ok: true, msg }
      } catch (err) {
        return { ok: false, msg: err.message }
      }
    }

    function getKeaSummary(kea) {
      const fills = getExecutionFills(kea)
      const watched = (kea.watchedMandates || []).map(function(x) { return x.orderId }).join(',')
      const fillText = fills
        .map(function(f) {
          return (f.legs || []).map(function(l) { return `#${l.orderId}` }).join('+')
        })
        .join(', ')

      return `${fills.length} fill(s), ${fillText || '-'}, watched: ${watched || '-'}`
    }

    async function verifyKeaDetail(kea, expected) {
      kea.watchedMandates = getWatchedMandates(kea, expected)

      await verifyIntents(kea)

      verifyMandatesMatchExecution(kea)
      verifyBundleHash(kea)
      verifyScope(kea, expected)
      verifyTxHash(kea)
      verifyPch(kea)
      verifyFillAgainstTransfers(kea)
    }

    // KEA is leg-native. A fill is an N-party clearing event:
    // { fillId, legs:[{orderId,numerator,denominator}], trigger }
    // This safety net folds old pairwise shapes into legs if needed.
    function normaliseFillShape(fill) {
      if (Array.isArray(fill?.legs)) return fill

      const legs = []
      if (fill?.orderId != null)
        legs.push({ orderId: String(fill.orderId), numerator: fill.numerator ?? 1, denominator: fill.denominator ?? 1 })
      if (fill?.takerOrderId != null)
        legs.push({ orderId: String(fill.takerOrderId), numerator: fill.takerNumerator ?? 1, denominator: fill.takerDenominator ?? 1 })

      return {
        fillId: fill?.fillId ?? null,
        legs,
        trigger: fill?.takerOrderId != null ? String(fill.takerOrderId) : null
      }
    }

    function getExecutionFills(kea) {
      const raw = kea.execution?.fills || (kea.execution?.fill ? [kea.execution.fill] : [])
      return raw.map(normaliseFillShape)
    }

    function getWatchedMandates(kea, expected) {
      const watched = String(expected.orderPubkey || '').toLowerCase()
      const mandates = kea.mandates || []

      if (watched) {
        const matched = mandates.filter(function(x) { return String(x.intentPubkey || '').toLowerCase() === watched })
        if (matched.length) return matched
      }

      if (mandates.length) return mandates

      throw new Error('No matching mandate for watched intent pubkey')
    }

    async function verifyIntents(kea) {
      for (const mandate of kea.watchedMandates || [])
        await verifyIntentMandate(mandate)
    }

    async function verifyIntentMandate(m) {
      if (!m?.intentPubkey || !m?.intentSignature || !m?.intentPayload)
        throw new Error('Missing mandate intent fields')

      const msg = new TextEncoder().encode(canonicalJson(m.intentPayload))
      const sig = Uint8Array.from(atob(m.intentSignature), function(c) { return c.charCodeAt(0) })
      const ok = await ed.verifyAsync(sig, msg, hexToBytes(m.intentPubkey))

      if (!ok) throw new Error(`Trader intent signature invalid for order ${m.orderId}`)
    }

    function verifyMandatesMatchExecution(kea) {
      const fills = getExecutionFills(kea)
      if (!fills.length) throw new Error('Missing execution fills')

      const fillOrderIds = new Set()

      for (const fill of fills)
        for (const leg of fill.legs || [])
          if (leg.orderId != null) fillOrderIds.add(String(leg.orderId))

      for (const mandate of kea.watchedMandates || [])
        if (!fillOrderIds.has(String(mandate.orderId)))
          throw new Error(`Watched mandate ${mandate.orderId} is not in execution fills`)
    }

    function verifyBundleHash(kea) {
      for (const mandate of kea.watchedMandates || []) {
        if (!mandate.bundle) throw new Error('Missing mandate bundle')
        if (!mandate.intentPayload?.bundleHash) throw new Error('Missing signed bundleHash')

        const expected = sha256Json(mandate.bundle)

        if (expected !== mandate.intentPayload.bundleHash)
          throw new Error(`Bundle hash does not match signed intent for order ${mandate.orderId}`)
      }
    }

    function verifyScope(kea, expected) {
      const pchBasis = kea.execution?.pchBasis

      if (expected.network && kea.network !== expected.network)
        throw new Error('KEA network mismatch')

      if (expected.network && kea.transaction?.network && kea.transaction.network !== expected.network)
        throw new Error('Transaction network mismatch')

      if (expected.network && pchBasis?.network && pchBasis.network !== expected.network)
        throw new Error('PCH network mismatch')

      for (const mandate of kea.watchedMandates || []) {
        const payload = mandate.intentPayload

        if (expected.orderPubkey && mandate.intentPubkey.toLowerCase() !== expected.orderPubkey)
          throw new Error('Intent pubkey does not match watched key')

        if (expected.network && payload.network !== expected.network)
          throw new Error(`Intent network mismatch for order ${mandate.orderId}`)

        if (expected.gameId && payload.gameId !== expected.gameId)
          throw new Error(`Game ID mismatch for order ${mandate.orderId}`)
      }
    }

    function getFillRatioForMandate(mandate, fill) {
      const orderId = String(mandate.orderId || '')
      const leg = (fill.legs || []).find(function(l) { return String(l.orderId || '') === orderId })
      if (!leg) return null
      return { numerator: leg.numerator, denominator: leg.denominator }
    }

    function verifyFillAgainstTransfers(kea) {
      const fills = getExecutionFills(kea)
      const mandates = kea.watchedMandates || []
      const pchBasis = kea.execution?.pchBasis

      if (!fills.length) throw new Error('Missing fills')
      if (!mandates.length) throw new Error('Missing watched mandates')
      if (!pchBasis) throw new Error('Missing pchBasis')

      const watchedAccounts = new Set()
      const residual = {}

      for (const mandate of mandates)
        for (const line of mandate.bundle || [])
          if (line.accountId) watchedAccounts.add(line.accountId)

      function add(accountId, asset, amount) {
        if (!watchedAccounts.has(accountId)) return
        const k = `${accountId}:${normaliseAssetId(asset)}`
        residual[k] = (residual[k] || 0) + Number(amount)
      }

      const t = pchBasis.transfers || {}

      for (const x of t.hbarTransfers || [])
        add(x.accountId, 'HBAR', x.amount)

      for (const x of t.tokenTransfers || [])
        add(x.accountId, x.tokenId, x.amount)

      for (const x of t.nftTransfers || []) {
        const asset = `${x.tokenId}#${x.serialNumber}`
        add(x.senderAccountId, asset, -1)
        add(x.receiverAccountId, asset, +1)
      }

      for (const fill of fills) {
        for (const mandate of mandates) {
          const ratio = getFillRatioForMandate(mandate, fill)
          if (!ratio) continue

          const numerator = Number(ratio.numerator)
          const denominator = Number(ratio.denominator)

          if (!numerator || !denominator || numerator < 1 || denominator < 1)
            throw new Error(`Invalid fill ratio for order ${mandate.orderId}`)

          if (numerator > denominator)
            throw new Error(`Fill ratio exceeds 1 for order ${mandate.orderId}`)

          for (const line of mandate.bundle || []) {
            const scaled = Math.trunc(Number(line.amount) * numerator / denominator)
            add(line.accountId, line.asset, -scaled)
          }
        }
      }

      const negative = Object.entries(residual).filter(function(pair) { return pair[1] < 0 })

      if (negative.length)
        throw new Error(`Transfers worse than signed bundle/fill: ${JSON.stringify(Object.fromEntries(negative))}`)
    }

    function verifyTxHash(kea) {
      const txBytes = hexToBytes(kea.transaction.txBytesHex)
      const txHash = bytesToHex(sha256(txBytes))

      if (txHash !== kea.transaction.txHash)
        throw new Error('txBytes hash mismatch')
    }

    function verifyPch(kea) {
      const pchBasis = kea.execution?.pchBasis
      const pch = kea.transaction?.pch

      if (!pchBasis) throw new Error('Missing pchBasis')
      if (!pch) throw new Error('Missing transaction PCH')

      const computed = sha256Json(pchBasis)

      if (computed !== pch)
        throw new Error('PCH hash mismatch')
    }

    // -------------------------------------------------------------------------
    // CONTROLLER: QR scan/paste/photo import
    // -------------------------------------------------------------------------

    async function scanQr() {
      if (!window.BarcodeDetector) {
        setStatus('Native QR scanner unavailable — opening photo picker')
        $('qrFile').click()
        return
      }

      qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })

      const video = $('qrVideo')
      video.srcObject = qrStream
      video.style.display = 'block'
      $('stopQrBtn').style.display = 'inline-block'

      await video.play()

      qrScanning = true
      const detector = new BarcodeDetector({ formats: ['qr_code'] })

      async function tick() {
        if (!qrScanning) return

        try {
          const codes = await detector.detect(video)
          if (codes.length) {
            stopQr()
            addWatchFromQr(codes[0].rawValue)
            return
          }
        } catch (err) {
          setStatus(`QR scan error: ${err.message}`, 'bad')
        }

        requestAnimationFrame(tick)
      }

      tick()
    }

    function stopQr() {
      qrScanning = false

      if (qrStream)
        qrStream.getTracks().forEach(function(t) { t.stop() })

      qrStream = null
      $('qrVideo').style.display = 'none'
      $('stopQrBtn').style.display = 'none'
    }

    function pasteQr() {
      const raw = prompt('Paste Katomia QR/link')
      if (raw) addWatchFromQr(raw)
    }

    function readQrFile(file) {
      const img = new Image()

      img.onload = function() {
        const canvas = document.createElement('canvas')
        canvas.width = img.naturalWidth
        canvas.height = img.naturalHeight

        const ctx = canvas.getContext('2d')
        ctx.drawImage(img, 0, 0)

        const data = ctx.getImageData(0, 0, canvas.width, canvas.height)
        const code = jsQR(data.data, data.width, data.height)

        if (!code) {
          setStatus('No QR found in image', 'bad')
          return
        }

        addWatchFromQr(code.data)
      }

      img.src = URL.createObjectURL(file)
    }

    function addWatchFromQr(raw) {
      const watch = parseKatomiaQr(raw)
      fillWatchForm(watch)
      addWatch(watch)
      closeWatchModal()
    }

    function parseKatomiaQr(raw) {
      const url = parseLooseUrl(raw)
      const p = url.searchParams

      const domain = p.get('domain') || url.hostname
      const baseUrl = p.get('baseUrl') || p.get('kpool') || `https://${domain}`
      const wsUrl = p.get('wsUrl') || p.get('ws') || `wss://${domain}/ws`
      const network = p.get('network')
      const gameId = p.get('gameId') || p.get('game') || ''
      const name = p.get('name') || p.get('displayName') || p.get('trader') || ''
      const orderPubkey = String(p.get('orderPubkey') || p.get('intentPubkey') || p.get('watchPubkey') || '').trim().toLowerCase()
      const mode = p.get('mode') || $('watchMode').value || 'fetch'

      if (!domain) throw new Error('QR missing domain')
      if (!network) throw new Error('QR missing network')
      if (!orderPubkey) throw new Error('QR missing trader intent public key')

      return normaliseWatch({ baseUrl, wsUrl, network, gameId, orderPubkey, mode, name })
    }

    function parseLooseUrl(raw) {
      raw = String(raw || '').trim()
      try { return new URL(raw) } catch {}
      try { return new URL(`https://${raw}`) } catch {}
      throw new Error('Could not parse QR/link')
    }

    // -------------------------------------------------------------------------
    // VIEW: render watches, events, modals
    // -------------------------------------------------------------------------

    function renderWatches() {
      const el = $('watches')
      el.innerHTML = ''

      if (!watches.length) {
        el.innerHTML = '<div class="empty">No watches yet. Scan a QR to add one, or use ⚙️ Tools for debug entry.</div>'
        return
      }

      const table = document.createElement('table')
      const head = document.createElement('tr')

      for (const h of ['Watch', 'Network', 'Game', 'Mode', 'Status', 'Last ping', 'Controls']) {
        const th = document.createElement('th')
        th.textContent = h
        head.appendChild(th)
      }

      table.appendChild(head)

      for (const w of watches) {
        const tr = document.createElement('tr')
        tr.className = 'clickable card-row'
        tr.onclick = function() { showWatchDetail(w) }

        cell(tr, watchMainText(w), 'Watch')
        cell(tr, w.network, 'Network')
        cell(tr, w.gameId || '-', 'Game')
        pillCell(tr, modeLabel(w.mode), 'Mode')
        cell(tr, w.paused ? 'paused' : w.status, 'Status', statusClass(w))
        cell(tr, w.lastSeenAt ? new Date(w.lastSeenAt).toLocaleTimeString() : '-', 'Last ping')

        const controls = document.createElement('td')
        controls.dataset.label = 'Controls'
        controls.appendChild(actionButton(w.paused ? 'Resume' : 'Pause', function() { toggleWatchPaused(w.id) }))
        controls.appendChild(actionButton('Edit', function() { openWatchModal(w) }))
        controls.appendChild(actionButton('Remove', function() { removeWatch(w.id) }, 'danger'))
        controls.className = 'controls'
        tr.appendChild(controls)

        table.appendChild(tr)
      }

      el.appendChild(table)
    }

    function renderEvents() {
      const el = $('events')
      el.innerHTML = ''

      if (!events.length) {
        el.innerHTML = '<div class="empty">No events yet. KEA will list doorbells and checked approval packages here.</div>'
        return
      }

      const table = document.createElement('table')
      const head = document.createElement('tr')

      for (const h of ['Time', 'Watch', 'Tx ID', 'PCH', 'Fetch', 'Check', 'Summary']) {
        const th = document.createElement('th')
        th.textContent = h
        head.appendChild(th)
      }

      table.appendChild(head)

      for (const e of events) {
        const tr = document.createElement('tr')
        tr.className = 'clickable card-row'
        tr.onclick = function() { showEventDetail(e) }

        cell(tr, new Date(e.createdAt).toLocaleTimeString(), 'Time')
        cell(tr, e.watchLabel || e.watchId || '-', 'Watch')
        cell(tr, shortHash(e.txid, 16), 'Tx ID', 'mono')
        cell(tr, shortHash(e.pch), 'PCH', 'mono')
        cell(tr, e.status || '', 'Fetch')
        cell(tr, e.check || '', 'Check', checkClass(e.check))
        cell(tr, e.summary || '', 'Summary')

        table.appendChild(tr)
      }

      el.appendChild(table)
    }

    function openWatchModal(w) {
      editingWatchId = w ? w.id : null
      $('watchModalTitle').textContent = w ? '⚙️ Edit debug watch' : '⚙️ Add debug watch'
      $('saveWatchBtn').textContent = w ? 'Save watch' : 'Add watch'
      fillWatchForm(w || defaultWatch())
      $('watchModal').showModal()
    }

    function closeWatchModal() {
      editingWatchId = null
      $('watchModal').close()
    }

    function fillWatchForm(w) {
      $('watchName').value = w.name || ''
      $('baseUrl').value = w.baseUrl || ''
      $('wsUrl').value = w.wsUrl || ''
      $('network').value = w.network || ''
      $('scopeGameId').value = w.gameId || ''
      $('orderPubkey').value = w.orderPubkey || ''
      $('watchMode').value = w.mode || 'fetch'
    }

    function defaultWatch() {
      return normaliseWatch({})
    }

    function showWatchDetail(w) {
      showJsonDetail('Watch detail', stripWatchRuntime(w))
    }

    function showEventDetail(e) {
      $('detailModalTitle').textContent = 'Event detail'

      const body = $('detailModalBody')
      body.innerHTML = ''

      body.appendChild(sectionTitle('Approval package'))
      body.appendChild(kvGrid([
        ['Watch', e.watchLabel || e.watchId || '-'],
        ['Network', e.network || '-'],
        ['Tx ID', e.txid || '-'],
        ['PCH', e.pch || '-'],
        ['Fetch', e.status || '-'],
        ['Check', e.check || '-'],
        ['Summary', e.summary || '-'],
        ['Mode', modeLabel(e.mode)]
      ]))

      body.appendChild(sectionTitle('Checks'))
      body.appendChild(renderChecks(e))

      body.appendChild(jsonDetails('Debug summary', e.debug || null))
      body.appendChild(jsonDetails('Fetch information', e.fetch || null))
      body.appendChild(jsonDetails('KEA detail', e.kea || null))
      body.appendChild(jsonDetails('Raw fetched package', e.raw || null))
      body.appendChild(jsonDetails('Raw doorbell', e.rawDoorbell || null))

      $('detailModal').showModal()
    }

    function showJsonDetail(title, data) {
      $('detailModalTitle').textContent = title
      const body = $('detailModalBody')
      body.innerHTML = ''
      body.appendChild(jsonBlock(data))
      $('detailModal').showModal()
    }

    function renderChecks(e) {
      const box = document.createElement('div')
      box.className = 'check-list'

      if (!e.verification && e.check !== 'fail') {
        box.appendChild(checkItem('⏳ Awaiting verification detail'))
        return box
      }

      if (e.verification?.ok) {
        box.appendChild(checkItem('✅ Trader intent signature checked'))
        box.appendChild(checkItem('✅ Transaction scope checked'))
        box.appendChild(checkItem('✅ PCH and bundle checks passed'))
        box.appendChild(checkItem('✅ Transfers are not worse than the signed bundle/fill'))
        return box
      }

      box.appendChild(checkItem(`❌ ${e.verification?.msg || e.summary || 'Check failed'}`))
      return box
    }

    function checkItem(text) {
      const div = document.createElement('div')
      div.className = 'check-item'
      div.textContent = text
      return div
    }

    function sectionTitle(text) {
      const h = document.createElement('h3')
      h.textContent = text
      return h
    }

    function kvGrid(items) {
      const grid = document.createElement('div')
      grid.className = 'grid'

      for (const item of items) {
        const div = document.createElement('div')
        div.className = 'kv'

        const label = document.createElement('div')
        label.className = 'kv-label'
        label.textContent = item[0]

        const value = document.createElement('div')
        value.className = 'kv-value'
        value.textContent = item[1]

        div.appendChild(label)
        div.appendChild(value)
        grid.appendChild(div)
      }

      return grid
    }

    function jsonDetails(title, data) {
      const details = document.createElement('details')
      const summary = document.createElement('summary')
      summary.textContent = title
      details.appendChild(summary)
      details.appendChild(jsonBlock(data))
      return details
    }

    function jsonBlock(data) {
      const pre = document.createElement('pre')
      pre.textContent = JSON.stringify(data, null, 2)
      return pre
    }

    function cell(tr, text, label, cls) {
      const td = document.createElement('td')
      td.dataset.label = label || ''
      td.textContent = text == null ? '' : String(text)
      if (cls) td.className = cls
      tr.appendChild(td)
      return td
    }

    function pillCell(tr, text, label) {
      const td = document.createElement('td')
      td.dataset.label = label || ''
      const span = document.createElement('span')
      span.className = 'pill'
      span.textContent = text
      td.appendChild(span)
      tr.appendChild(td)
      return td
    }

    function actionButton(text, fn, cls) {
      const btn = document.createElement('button')
      btn.textContent = text
      if (cls) btn.className = cls
      btn.onclick = function(ev) {
        ev.stopPropagation()
        fn()
      }
      return btn
    }

    function setStatus(msg, cls) {
      const el = $('status')
      el.textContent = msg || 'Ready.'
      el.className = `status-line ${cls || ''}`
      console.debug('[KEA]', msg)
    }

    // -------------------------------------------------------------------------
    // VIEW: display helpers
    // -------------------------------------------------------------------------

    function watchLabel(w) {
      if (w.name) return w.name
      return `${w.network}/${w.gameId || '-'} ${shortKey(w.orderPubkey)}`
    }

    function watchMainText(w) {
      const host = formatHost(w.baseUrl)
      const key = shortKey(w.orderPubkey)
      if (w.name) return `${w.name} · ${key} · ${host}`
      return `${key} · ${host}`
    }

    function modeLabel(mode) {
      if (mode === 'doorbell') return 'Doorbell'
      if (mode === 'sign') return 'Sign later'
      return 'Fetch/check'
    }

    function statusClass(w) {
      if (w.paused) return 'warn'
      if (w.status === 'connected') return 'ok'
      if (w.status === 'error') return 'bad'
      return ''
    }

    function checkClass(check) {
      if (check === 'pass') return 'ok'
      if (check === 'fail') return 'bad'
      if (check === 'pending') return 'warn'
      return ''
    }

    function formatHost(url) {
      try { return new URL(url).host } catch { return String(url || '-') }
    }

    function shortHash(x, n = 8) {
      x = String(x || '')
      return x.length > n ? x.slice(0, n) : x
    }

    function shortKey(x) {
      x = String(x || '')
      return x.length > 12 ? `${x.slice(0, 8)}…${x.slice(-4)}` : x
    }

    // -------------------------------------------------------------------------
    // LOW-LEVEL UTILS
    // -------------------------------------------------------------------------

    function $(id) {
      return document.getElementById(id)
    }

    function makeId() {
      return `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`
    }

    function cleanUrl(x) {
      return String(x || '').trim().replace(/\/$/, '')
    }

    function canonicalJson(obj) {
      return JSON.stringify(obj)
    }

    function sha256Json(obj) {
      const bytes = new TextEncoder().encode(JSON.stringify(obj))
      return bytesToHex(sha256(bytes))
    }

    function hexToBytes(hex) {
      const clean = String(hex || '').trim()
      const pairs = clean.match(/.{1,2}/g) || []
      return Uint8Array.from(pairs.map(function(x) { return parseInt(x, 16) }))
    }

    function bytesToHex(bytes) {
      return [...bytes].map(function(b) { return b.toString(16).padStart(2, '0') }).join('')
    }

    function normaliseAssetId(asset) {
      return String(asset).toUpperCase() === 'HBAR' ? 'HBAR' : String(asset)
    }

    function resetAll() {
      for (const id of Object.keys(sockets)) disconnectWatch(id)
      delete localStorage[WATCHES_KEY]
      watches = []
      events.length = 0
      renderWatches()
      renderEvents()
      closeWatchModal()
      setStatus('Reset local KEA data')
    }

    // -------------------------------------------------------------------------
    // APP BOOTSTRAP
    // -------------------------------------------------------------------------

    $('scanQrBtn').onclick = function() {
      scanQr().catch(function(e) { setStatus(`ERROR ${e.message}`, 'bad') })
    }

    $('toolsBtn').onclick = function() { openWatchModal() }
    $('pasteQrBtn').onclick = function() {
      try { pasteQr() } catch (e) { setStatus(`ERROR ${e.message}`, 'bad') }
    }
    $('stopQrBtn').onclick = function() { stopQr() }
    $('qrFile').onchange = function(e) {
      const file = e.target.files?.[0]
      if (file) readQrFile(file)
    }

    $('saveWatchBtn').onclick = function() {
      try { saveWatchFromForm() } catch (e) { setStatus(`ERROR ${e.message}`, 'bad') }
    }
    $('resetBtn').onclick = function() { resetAll() }
    $('cancelWatchBtn').onclick = function() { closeWatchModal() }
    $('watchModalCloseBtn').onclick = function() { closeWatchModal() }
    $('detailModalCloseBtn').onclick = function() { $('detailModal').close() }

    loadWatches()
    renderWatches()
    renderEvents()
    connectAllWatches()
  </script>
</body>
</html>
