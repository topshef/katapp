<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>KEA Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; }
    button { padding: 8px 12px; margin: 4px 0; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin: 4px 0 12px; }
    pre { background: #111; color: #ddd; padding: 12px; overflow: auto; white-space: pre-wrap; resize: vertical; }
    #log { max-height: 200px; }
    #detail { max-height: 320px; }
    .ok { color: green; }
    .bad { color: crimson; }
  </style>

  <script src="https://kpay.uk/assets/js/darkmode.js?v=0.2"></script>

</head>
<body>
  <h1>KEA Prototype</h1>
  <p>Browser execution agent. WebSocket doorbell now; FCM later.</p>

  <button id="scanQrBtn">Scan Katomia QR</button>
  <button id="pasteQrBtn">Paste QR link</button>
  <button id="stopQrBtn" style="display:none">Stop camera</button>
  <input id="qrFile" type="file" accept="image/*" capture="environment" style="display:none">
  <video id="qrVideo" playsinline style="display:none; width:100%; max-height:260px; background:#111"></video>

  <label>KPool base URL</label>
  <input id="baseUrl" value="https://hapi5.katomia.com">


  <label>WebSocket URL</label>
  <input id="wsUrl" value="wss://hapi5.katomia.com/ws">

  <label>Network</label>
  <input id="network" value="mainnet">

  <label>Game ID</label>
  <input id="scopeGameId" value="">

  <label>Order intent public key to watch</label>
  <input id="orderPubkey" value="777efe5d8f02b77d5b658e89a0ce660cb2abecc4a563dcfc70874c2224424fc5">

  <h2>Doorbell</h2>
  <button id="connectBtn">Connect doorbell</button>
  <button id="testBtn">Manual fetch (URL or network;txid;pch)</button>
  <button id="verifyBtn">Verify displayed KEA detail</button>
  <button id="resetBtn">Reset config</button>
  
  <h2>Events</h2>
  <div id="events"></div>

  <h2>Status</h2>
  <pre id="log"></pre>

  <h2>Fetched detail</h2>
  <pre id="detail"></pre>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


<script type="module">
import * as ed from "https://esm.sh/@noble/ed25519@2.1.0"
import { sha512 } from "https://esm.sh/@noble/hashes@1.4.0/sha512"
import { sha256 } from "https://esm.sh/@noble/hashes@1.4.0/sha256"

ed.etc.sha512Sync = (...m) => sha512(ed.etc.concatBytes(...m))

const $ = id => document.getElementById(id)
const log = x => $('log').textContent = `[${new Date().toLocaleTimeString()}] ${x}\n` + $('log').textContent

const events = []

const CONFIG_FIELDS = [  // ?? wtf why mapping nerdshit here?  can't we simplify and just map the names as is? nerdfuckers need this shit
  ['baseUrl', 'keaBaseUrl'],
  ['wsUrl', 'keaWsUrl'],
  ['network', 'keaNetwork'],   // todo cleanup confusion - this is NOT KEA network, it is Hedera network
  ['scopeGameId', 'keaScopeGameId'],  // the game is Katomia scope
  ['orderPubkey', 'keaOrderPubkey']
]

function getBaseUrl() {
  return $('baseUrl').value.replace(/\/$/, '')
}

function saveConfig() {
  for (const [id, key] of CONFIG_FIELDS) {
    const el = $(id)
    if (el) localStorage[key] = el.value
  }
}

function loadConfig() {
  for (const [id, key] of CONFIG_FIELDS) {
    const el = $(id)
    if (!el) continue
    const saved = localStorage[key]
    if (saved == null) continue
    const pageDefault = el.value          // read before we overwrite it
    if (saved !== pageDefault)
      log(`config: using SAVED ${id}="${saved}" (page default was "${pageDefault}") — click "Reset config" to use page defaults`)
    el.value = saved
  }
}

function resetConfig() {
  for (const [, key] of CONFIG_FIELDS) delete localStorage[key]
  delete localStorage.keaLastManual
  location.reload()
}





// ╔═╗ ╦═╗
// ║═╬╗╠╦╝
// ╚═╝╚╩╚═
// QR

let qrStream = null
let qrScanning = false

async function scanQr() {
  if (!window.BarcodeDetector) {
    log('Native QR scanner unavailable — opening camera/photo picker')
    $('qrFile').click()
    return
  }

  qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })

  const video = $('qrVideo')
  video.srcObject = qrStream
  video.style.display = 'block'
  $('stopQrBtn').style.display = 'inline-block'

  await video.play()

  qrScanning = true
  const detector = new BarcodeDetector({ formats: ['qr_code'] })

  const tick = async () => {
    if (!qrScanning) return

    try {
      const codes = await detector.detect(video)
      if (codes.length) {
        stopQr()
        applyKatomiaQr(codes[0].rawValue)
        return
      }
    } catch (err) {
      log(`QR scan error ${err.message}`)
    }

    requestAnimationFrame(tick)
  }

  tick()
}

function stopQr() {
  qrScanning = false

  if (qrStream)
    qrStream.getTracks().forEach(t => t.stop())

  qrStream = null
  $('qrVideo').style.display = 'none'
  $('stopQrBtn').style.display = 'none'
}

function pasteQr() {
  const raw = prompt('Paste Katomia QR/link')
  if (raw) applyKatomiaQr(raw)
}

function readQrFile(file) {
  const img = new Image()

  img.onload = () => {
    const canvas = document.createElement('canvas')
    canvas.width = img.naturalWidth
    canvas.height = img.naturalHeight

    const ctx = canvas.getContext('2d')
    ctx.drawImage(img, 0, 0)

    const data = ctx.getImageData(0, 0, canvas.width, canvas.height)
    const code = jsQR(data.data, data.width, data.height)

    if (!code) {
      log('No QR found in image')
      return
    }

    applyKatomiaQr(code.data)
  }

  img.src = URL.createObjectURL(file)
}

function applyKatomiaQr(raw) {
  const parsed = parseKatomiaQr(raw)

  $('baseUrl').value = parsed.baseUrl
  $('wsUrl').value = parsed.wsUrl
  $('network').value = parsed.network
  $('scopeGameId').value = parsed.gameId
  $('orderPubkey').value = parsed.orderPubkey

  saveConfig()
  log(`Loaded Katomia watch ${parsed.network}/${parsed.gameId} ${parsed.orderPubkey.slice(0, 8)}...`)
}

function parseKatomiaQr(raw) {
  const url = new URL(raw)
  const p = url.searchParams

  const domain = p.get('domain')
  const network = p.get('network')
  const gameId = p.get('gameId') || ''
  const orderPubkey = (p.get('orderPubkey') || '').trim().toLowerCase()

  if (!domain) throw new Error('QR missing domain')
  if (!network) throw new Error('QR missing network')
  if (!orderPubkey) throw new Error('QR missing orderPubkey')

  return {
    baseUrl: `https://${domain}`,
    wsUrl: `wss://${domain}/ws`,
    network,
    gameId,
    orderPubkey
  }
}










// ┌─┐┌─┐┬─┐┬  ┬┌─┐┬─┐  ┌─┐┬ ┬┬┌┬┐
// ├┤ ├─┤├┬┘│  │├┤ ├┬┘  └─┐├─┤│ │ 
// └─┘┴ ┴┴└─┴─┘┴└─┘┴└─  └─┘┴ ┴┴ ┴ 
// earlier shit

// TODO lets label up the code sections

const hexToBytes = hex => Uint8Array.from(hex.match(/.{1,2}/g).map(x => parseInt(x, 16)))
const bytesToHex = bytes => [...bytes].map(b => b.toString(16).padStart(2, '0')).join('')
const canonicalJson = obj => JSON.stringify(obj)

function addEvent(msg) {
  const key = `${msg.network};${msg.txid};${msg.pch}`

  if (!events.some(e => e.key === key))
    events.unshift({ key, ...msg })

  renderEvents()
  log(`Doorbell ${key}`)
}

function renderEvents() {
  const el = $('events')
  if (!el) return

  el.innerHTML = ''

  for (const e of events) {
    const btn = document.createElement('button')
    btn.textContent = `Fetch ${e.network}; ${e.txid}; ${e.pch}`
    btn.onclick = () => fetchTxDetail(e).catch(err => log(`ERROR ${err.message}`))
    el.appendChild(btn)
    el.appendChild(document.createElement('br'))
  }
}

function connectDoorbell() {
  saveConfig()

  const orderPubkey = $('orderPubkey').value.trim().toLowerCase()
  if (!orderPubkey) {
    log('ERROR missing order intent pubkey')
    return
  }

  const ws = new WebSocket($('wsUrl').value)

  ws.onopen = () => {
    log('Doorbell connected')

    ws.send(JSON.stringify({
      type: 'kpool_watch',
      filter: {
        mode: 'kea',
        network: $('network').value,
        orderPubkey
      }
    }))

    log(`Subscribed for orderPubkey ${orderPubkey.slice(0, 8)}...`)
  }

  ws.onmessage = ev => {
    let msg
    try { msg = JSON.parse(ev.data) } catch { return }

    if (msg.type === 'kea_request') {
      addEvent(msg)
      return
    }

    log(`WS ${JSON.stringify(msg)}`)
  }

  ws.onclose = () => log('Doorbell disconnected')
  ws.onerror = () => log('Doorbell error')
}

async function fetchTxDetail(e) {
  //const url = `${getBaseUrl()}/kpool/txRead?network=${encodeURIComponent(e.network)}&txid=${encodeURIComponent(e.txid)}&checksum=${encodeURIComponent(e.pch)}&detail=1&mirror=0`

  const url = `${getBaseUrl()}/kpool/txRead?network=${encodeURIComponent(e.network)}&txid=${e.txid}&pch=${encodeURIComponent(e.pch)}&detail=1&mirror=0`

  log(`Fetching ${url}`)

  const res = await fetch(url)
  const data = await res.json()

  // txRead is wrapped in a { success, comment, result } envelope — unwrap it
  const out = data.result || data

  $('detail').textContent = JSON.stringify(out.kea || out, null, 2)

  if (!out.kea) {
    log(`Fetched tx but no kea: ${out.keaError || 'no kea detail'}`)
    return
  }

  log(`Fetched KEA detail: transferCheck=${out.kea.execution?.transferCheck?.status}`)
  
}

async function verifyDisplayedKea() {
  const raw = $('detail').textContent
  if (!raw) {
    log('No detail loaded')
    return
  }

  const kea = JSON.parse(raw)
  await verifyIntent(kea)
  verifyTxHash(kea)

  log('KEA detail verified: intent sig + tx hash OK')
}

async function verifyIntent(kea) {
  const m = kea.mandate
  if (!m?.intentPubkey || !m?.intentSignature || !m?.intentPayload)
    throw new Error('Missing mandate intent fields')

  const msg = new TextEncoder().encode(canonicalJson(m.intentPayload))
  const sig = Uint8Array.from(atob(m.intentSignature), c => c.charCodeAt(0))
  const ok = await ed.verifyAsync(sig, msg, hexToBytes(m.intentPubkey))

  if (!ok) throw new Error('Trader intent signature invalid')
}

function verifyTxHash(kea) {
  const txBytes = hexToBytes(kea.transaction.txBytesHex)
  const txHash = bytesToHex(sha256(txBytes))

  if (txHash !== kea.transaction.txHash)
    throw new Error('txBytes hash mismatch')
}

function parseManualInput(raw) {
  raw = (raw || '').trim()
  if (!raw) return null

  // full URL or bare query string — anything containing '='
  if (raw.includes('=')) {
    const qs = raw.includes('?') ? raw.slice(raw.indexOf('?') + 1) : raw
    const p = new URLSearchParams(qs)
    const network = p.get('network')
    const txid = p.get('txid')
    const pch = p.get('pch') || p.get('checksum')
    return (network && txid && pch) ? { network, txid, pch } : null
  }

  // legacy: network;txid;pch
  const [network, txid, pch] = raw.split(';').map(x => x.trim())
  return (network && txid && pch) ? { network, txid, pch } : null
}

async function manualFetch() {
  const raw = prompt('Paste a full URL, a query string, or network;txid;pch', localStorage.keaLastManual || '')
  if (!raw) return

  const parsed = parseManualInput(raw)
  if (!parsed) {
    log('ERROR could not parse network/txid/pch from input')
    return
  }

  localStorage.keaLastManual = raw
  saveConfig()
  await fetchTxDetail(parsed)
}

//QR - can we put this next thre fucking QR code, do we need to nerd split the shit?
$('scanQrBtn').onclick = () => scanQr().catch(e => log(`ERROR ${e.message}`))
$('pasteQrBtn').onclick = () => pasteQr()
$('stopQrBtn').onclick = () => stopQr()
$('qrFile').onchange = e => {
  const file = e.target.files?.[0]
  if (file) readQrFile(file)
}

//earlier shit

$('connectBtn').onclick = () => connectDoorbell()
$('testBtn').onclick = () => manualFetch().catch(e => log(`ERROR ${e.message}`))

$('verifyBtn').onclick = () => verifyDisplayedKea().catch(e => log(`ERROR ${e.message}`))
$('resetBtn').onclick = () => resetConfig()

loadConfig()
</script>

</body>
</html>
