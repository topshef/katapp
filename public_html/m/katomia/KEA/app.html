<body>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


<script type="module">


import * as ed from "https://esm.sh/@noble/ed25519@2.1.0"
import { sha512 } from "https://esm.sh/@noble/hashes@1.4.0/sha512"
import { sha256 } from "https://esm.sh/@noble/hashes@1.4.0/sha256"

ed.etc.sha512Sync = (...m) => sha512(ed.etc.concatBytes(...m))

const $ = id => document.getElementById(id)
const log = x => $('log').textContent = `[${new Date().toLocaleTimeString()}] ${x}\n` + $('log').textContent


const events = []

function eventKey(e) {
  return `${e.network};${e.txid};${e.pch}`
}

function shortHash(x, n = 6) {
  x = String(x || '')
  return x.length > n ? x.slice(0, n) : x
}

function eventCell(tr, text, cls = '') {
  const td = document.createElement('td')
  td.textContent = text || ''
  if (cls) td.className = cls
  tr.appendChild(td)
}


const CONFIG_FIELDS = [  // ?? wtf why mapping nerdshit here?  can't we simplify and just map the names as is? nerdfuckers need this shit
  ['baseUrl', 'keaBaseUrl'],
  ['wsUrl', 'keaWsUrl'],
  ['network', 'keaNetwork'],   // todo cleanup confusion - this is NOT KEA network, it is Hedera network
  ['scopeGameId', 'keaScopeGameId'],  // the game is Katomia scope
  ['orderPubkey', 'keaOrderPubkey']
]

function getBaseUrl() {
  return $('baseUrl').value.replace(/\/$/, '')
}

function saveConfig() {
  for (const [id, key] of CONFIG_FIELDS) {
    const el = $(id)
    if (el) localStorage[key] = el.value
  }
}

function loadConfig() {
  for (const [id, key] of CONFIG_FIELDS) {
    const el = $(id)
    if (!el) continue
    const saved = localStorage[key]
    if (saved == null) continue
    const pageDefault = el.value          // read before we overwrite it
    if (saved !== pageDefault)
      log(`config: using SAVED ${id}="${saved}" (page default was "${pageDefault}") — click "Reset config" to use page defaults`)
    el.value = saved
  }
}

function resetConfig() {
  for (const [, key] of CONFIG_FIELDS) delete localStorage[key]
  delete localStorage.keaLastManual
  location.reload()
}

// QR

let qrStream = null
let qrScanning = false

async function scanQr() {
  if (!window.BarcodeDetector) {
    log('Native QR scanner unavailable — opening camera/photo picker')
    $('qrFile').click()
    return
  }

  qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })

  const video = $('qrVideo')
  video.srcObject = qrStream
  video.style.display = 'block'
  $('stopQrBtn').style.display = 'inline-block'

  await video.play()

  qrScanning = true
  const detector = new BarcodeDetector({ formats: ['qr_code'] })

  const tick = async () => {
    if (!qrScanning) return

    try {
      const codes = await detector.detect(video)
      if (codes.length) {
        stopQr()
        applyKatomiaQr(codes[0].rawValue)
        return
      }
    } catch (err) {
      log(`QR scan error ${err.message}`)
    }

    requestAnimationFrame(tick)
  }

  tick()
}

function stopQr() {
  qrScanning = false

  if (qrStream)
    qrStream.getTracks().forEach(t => t.stop())

  qrStream = null
  $('qrVideo').style.display = 'none'
  $('stopQrBtn').style.display = 'none'
}

function pasteQr() {
  const raw = prompt('Paste Katomia QR/link')
  if (raw) applyKatomiaQr(raw)
}

function readQrFile(file) {
  const img = new Image()

  img.onload = () => {
    const canvas = document.createElement('canvas')
    canvas.width = img.naturalWidth
    canvas.height = img.naturalHeight

    const ctx = canvas.getContext('2d')
    ctx.drawImage(img, 0, 0)

    const data = ctx.getImageData(0, 0, canvas.width, canvas.height)
    const code = jsQR(data.data, data.width, data.height)

    if (!code) {
      log('No QR found in image')
      return
    }

    applyKatomiaQr(code.data)
  }

  img.src = URL.createObjectURL(file)
}

function applyKatomiaQr(raw) {
  const parsed = parseKatomiaQr(raw)

  $('baseUrl').value = parsed.baseUrl
  $('wsUrl').value = parsed.wsUrl
  $('network').value = parsed.network
  $('scopeGameId').value = parsed.gameId
  $('orderPubkey').value = parsed.orderPubkey

  saveConfig()
  log(`Loaded Katomia watch ${parsed.network}/${parsed.gameId} ${parsed.orderPubkey.slice(0, 8)}...`)
}

function parseKatomiaQr(raw) {
  const url = new URL(raw)
  const p = url.searchParams

  const domain = p.get('domain')
  const network = p.get('network')
  const gameId = p.get('gameId') || ''
  const orderPubkey = (p.get('orderPubkey') || '').trim().toLowerCase()

  if (!domain) throw new Error('QR missing domain')
  if (!network) throw new Error('QR missing network')
  if (!orderPubkey) throw new Error('QR missing orderPubkey')

  return {
    baseUrl: `https://${domain}`,
    wsUrl: `wss://${domain}/ws`,
    network,
    gameId,
    orderPubkey
  }
}






async function verifyKeaDetail(kea, expected) {
  kea.watchedMandates = getWatchedMandates(kea, expected)
  kea.mandate = kea.watchedMandates[0]

  await verifyIntents(kea)

  verifyMandatesMatchExecution(kea)
  verifyBundleHash(kea)
  verifyScope(kea, expected)
  verifyTxHash(kea)
  verifyPch(kea)
  verifyFillAgainstTransfers(kea)
}


function getExecutionFills(kea) {
  return kea.execution?.fills || (kea.execution?.fill ? [kea.execution.fill] : [])
}

function getWatchedMandates(kea, expected) {
  const watched = (expected.orderPubkey || '').toLowerCase()
  const mandates = kea.mandates || (kea.mandate ? [kea.mandate] : [])

  if (watched) {
    const matched = mandates.filter(x => String(x.intentPubkey || '').toLowerCase() === watched)
    if (matched.length) return matched
  }

  if (mandates.length) return mandates

  throw new Error('No matching mandate for watched intent pubkey')
}



function verifyMandatesMatchExecution(kea) {
  const fills = getExecutionFills(kea)
  if (!fills.length)
    throw new Error('Missing execution fills')

  const fillOrderIds = new Set()

  for (const fill of fills) {
    if (fill.orderId) fillOrderIds.add(String(fill.orderId))
    if (fill.takerOrderId) fillOrderIds.add(String(fill.takerOrderId))
  }

  for (const mandate of kea.watchedMandates || []) {
    if (!fillOrderIds.has(String(mandate.orderId)))
      throw new Error(`Watched mandate ${mandate.orderId} is not in execution fills`)
  }
}



function sha256Json(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj))
  return bytesToHex(sha256(bytes))
}



function verifyBundleHash(kea) {
  for (const mandate of kea.watchedMandates || []) {
    if (!mandate.bundle)
      throw new Error('Missing mandate bundle')

    if (!mandate.intentPayload?.bundleHash)
      throw new Error('Missing signed bundleHash')

    const expected = sha256Json(mandate.bundle)

    if (expected !== mandate.intentPayload.bundleHash)
      throw new Error(`Bundle hash does not match signed intent for order ${mandate.orderId}`)
  }
}



function verifyScope(kea, expected) {
  const pchBasis = kea.execution?.pchBasis

  if (expected.network && kea.network !== expected.network)
    throw new Error('KEA network mismatch')

  if (expected.network && kea.transaction?.network && kea.transaction.network !== expected.network)
    throw new Error('Transaction network mismatch')

  if (expected.network && pchBasis?.network && pchBasis.network !== expected.network)
    throw new Error('PCH network mismatch')

  for (const mandate of kea.watchedMandates || []) {
    const payload = mandate.intentPayload

    if (expected.orderPubkey && mandate.intentPubkey.toLowerCase() !== expected.orderPubkey)
      throw new Error('Intent pubkey does not match watched key')

    if (expected.network && payload.network !== expected.network)
      throw new Error(`Intent network mismatch for order ${mandate.orderId}`)

    if (expected.gameId && payload.gameId !== expected.gameId)
      throw new Error(`Game ID mismatch for order ${mandate.orderId}`)
  }
}




function getFillRatioForMandate(mandate, fill) {
  const mandateOrderId = String(mandate.orderId || '')
  const makerOrderId = String(fill.orderId || '')
  const takerOrderId = String(fill.takerOrderId || '')

  if (mandateOrderId === makerOrderId)
    return {
      numerator: fill.numerator,
      denominator: fill.denominator
    }

  if (mandateOrderId === takerOrderId)
    return {
      numerator: fill.takerNumerator,
      denominator: fill.takerDenominator
    }

  return null
}




function verifyFillAgainstTransfers(kea) {
  const fills = getExecutionFills(kea)
  const mandates = kea.watchedMandates || []
  const pchBasis = kea.execution?.pchBasis

  if (!fills.length) throw new Error('Missing fills')
  if (!mandates.length) throw new Error('Missing watched mandates')
  if (!pchBasis) throw new Error('Missing pchBasis')

  const watchedAccounts = new Set()
  const residual = {}

  for (const mandate of mandates)
    for (const line of mandate.bundle || [])
      if (line.accountId) watchedAccounts.add(line.accountId)

  function add(accountId, asset, amount) {
    if (!watchedAccounts.has(accountId)) return
    const k = `${accountId}:${normaliseAssetId(asset)}`
    residual[k] = (residual[k] || 0) + Number(amount)
  }

  const t = pchBasis.transfers || {}

  for (const x of t.hbarTransfers || [])
    add(x.accountId, 'HBAR', x.amount)

  for (const x of t.tokenTransfers || [])
    add(x.accountId, x.tokenId, x.amount)

  for (const x of t.nftTransfers || []) {
    const asset = `${x.tokenId}#${x.serialNumber}`
    add(x.senderAccountId, asset, -1)
    add(x.receiverAccountId, asset, +1)
  }

  for (const fill of fills) {
    for (const mandate of mandates) {
      const ratio = getFillRatioForMandate(mandate, fill)
      if (!ratio) continue

      const numerator = Number(ratio.numerator)
      const denominator = Number(ratio.denominator)

      if (!numerator || !denominator || numerator < 1 || denominator < 1)
        throw new Error(`Invalid fill ratio for order ${mandate.orderId}`)

      if (numerator > denominator)
        throw new Error(`Fill ratio exceeds 1 for order ${mandate.orderId}`)

      for (const line of mandate.bundle || []) {
        const scaled = Math.trunc(Number(line.amount) * numerator / denominator)
        add(line.accountId, line.asset, -scaled)
      }
    }
  }

  const negative = Object.entries(residual).filter(([, v]) => v < 0)

  if (negative.length)
    throw new Error(`Transfers worse than signed bundle/fill: ${JSON.stringify(Object.fromEntries(negative))}`)
}





function normaliseAssetId(asset) {
  return String(asset).toUpperCase() === 'HBAR' ? 'HBAR' : String(asset)
}

// TODO lets label up the code sections

const hexToBytes = hex => Uint8Array.from(hex.match(/.{1,2}/g).map(x => parseInt(x, 16)))
const bytesToHex = bytes => [...bytes].map(b => b.toString(16).padStart(2, '0')).join('')
const canonicalJson = obj => JSON.stringify(obj)


function addEvent(msg) {
  const key = eventKey(msg)
  let e = events.find(x => x.key === key)

  if (!e) {
    e = { key, ...msg, status: 'doorbell', check: 'pending', summary: '' }
    events.unshift(e)
  } else {
    Object.assign(e, msg)
    e.status = 'doorbell'
    e.check = 'pending'
  }

  renderEvents()
  log(`Doorbell ${key}`)

  fetchTxDetail(e).catch(err => {
    e.status = 'fetch error'
    e.check = 'fail'
    e.summary = err.message
    renderEvents()
    log(`ERROR ${err.message}`)
  })
}

function renderEvents() {
  const el = $('events')
  if (!el) return

  el.innerHTML = ''

  if (!events.length) {
    el.textContent = 'No events yet'
    return
  }

  const table = document.createElement('table')
  const head = document.createElement('tr')

  for (const h of ['Network', 'Tx ID', 'PCH', 'Fetch', 'Check', 'Debug']) {
    const th = document.createElement('th')
    th.textContent = h
    head.appendChild(th)
  }

  table.appendChild(head)

  for (const e of events) {
    const tr = document.createElement('tr')

    eventCell(tr, e.network)
    eventCell(tr, e.txid, 'mono')
    eventCell(tr, shortHash(e.pch), 'mono')
    eventCell(tr, e.status || '')
    eventCell(tr, e.check || '', e.check === 'pass' ? 'ok' : e.check === 'fail' ? 'bad' : '')
    eventCell(tr, e.summary || '')

    table.appendChild(tr)
  }

  el.appendChild(table)
}




function connectDoorbell() {
  saveConfig()

  const orderPubkey = $('orderPubkey').value.trim().toLowerCase()
  if (!orderPubkey) {
    log('ERROR missing order intent pubkey')
    return
  }

  const ws = new WebSocket($('wsUrl').value)

  ws.onopen = () => {
    log('Doorbell connected')

    ws.send(JSON.stringify({
      type: 'kpool_watch',
      filter: {
        mode: 'kea',
        network: $('network').value,
        orderPubkey
      }
    }))

    log(`Subscribed for orderPubkey ${orderPubkey.slice(0, 8)}...`)
  }

  ws.onmessage = ev => {
    let msg
    try { msg = JSON.parse(ev.data) } catch { return }

    if (msg.type === 'kea_request') {
      addEvent(msg)
      return
    }

    log(`WS ${JSON.stringify(msg)}`)
  }

  ws.onclose = () => log('Doorbell disconnected')
  ws.onerror = () => log('Doorbell error')
}



async function fetchTxDetail(e) {
  const url = `${getBaseUrl()}/kpool/txRead?network=${encodeURIComponent(e.network)}&txid=${e.txid}&pch=${encodeURIComponent(e.pch)}&detail=1&mirror=0`

  e.status = 'fetching'
  e.check = 'pending'
  e.summary = ''
  renderEvents()

  log(`Fetching ${url}`)

  const res = await fetch(url)
  const data = await res.json()

  const out = data.result || data

  e.status = 'fetched'
  e.raw = out
  e.kea = out.kea || null

  $('detail').textContent = JSON.stringify(out.kea || out, null, 2)

  if (!out.kea) {
    e.check = 'fail'
    e.summary = out.keaError || 'no kea detail'
    renderEvents()
    log(`Fetched tx but no kea: ${e.summary}`)
    return
  }

  log('Fetched KEA detail')

  const result = await verifyFetchedKea(out.kea)
  e.check = result.ok ? 'pass' : 'fail'
  e.summary = result.msg

  renderEvents()
}






async function verifyFetchedKea(kea) {
  try {
    await verifyKeaDetail(kea, {
      network: $('network').value.trim(),
      gameId: $('scopeGameId').value.trim(),
      orderPubkey: $('orderPubkey').value.trim().toLowerCase()
    })

    log('✅ KEA VERIFY PASS: local checks passed')
    return { ok: true, msg: getKeaSummary(kea) }
  } catch (err) {
    log(`❌ KEA VERIFY FAIL: ${err.message}`)
    return { ok: false, msg: err.message }
  }
}

function getKeaSummary(kea) {
  const fills = getExecutionFills(kea).length
  const mandates = (kea.watchedMandates || []).map(x => x.orderId).join(',')
  return `${fills} fill(s), watched order(s): ${mandates || '-'}`
}



async function verifyDisplayedKea() {
  const raw = $('detail').textContent
  if (!raw) {
    log('No detail loaded')
    return
  }

  const kea = JSON.parse(raw)

  await verifyKeaDetail(kea, {
    network: $('network').value.trim(),
    gameId: $('scopeGameId').value.trim(),
    orderPubkey: $('orderPubkey').value.trim().toLowerCase()
  })

  log('KEA detail verified locally: safe-to-sign checks passed')
}



async function verifyIntents(kea) {
  for (const mandate of kea.watchedMandates || [])
    await verifyIntentMandate(mandate)
}

async function verifyIntentMandate(m) {
  if (!m?.intentPubkey || !m?.intentSignature || !m?.intentPayload)
    throw new Error('Missing mandate intent fields')

  const msg = new TextEncoder().encode(canonicalJson(m.intentPayload))
  const sig = Uint8Array.from(atob(m.intentSignature), c => c.charCodeAt(0))
  const ok = await ed.verifyAsync(sig, msg, hexToBytes(m.intentPubkey))

  if (!ok) throw new Error(`Trader intent signature invalid for order ${m.orderId}`)
}



function verifyTxHash(kea) {
  const txBytes = hexToBytes(kea.transaction.txBytesHex)
  const txHash = bytesToHex(sha256(txBytes))

  if (txHash !== kea.transaction.txHash)
    throw new Error('txBytes hash mismatch')
}

function verifyPch(kea) {
  const pchBasis = kea.execution?.pchBasis
  const pch = kea.transaction?.pch

  if (!pchBasis)
    throw new Error('Missing pchBasis')

  if (!pch)
    throw new Error('Missing transaction PCH')

  const computed = sha256Json(pchBasis)

  if (computed !== pch)
    throw new Error('PCH hash mismatch')
}


function parseManualInput(raw) {
  raw = (raw || '').trim()
  if (!raw) return null

  // full URL or bare query string — anything containing '='
  if (raw.includes('=')) {
    const qs = raw.includes('?') ? raw.slice(raw.indexOf('?') + 1) : raw
    const p = new URLSearchParams(qs)
    const network = p.get('network')
    const txid = p.get('txid')
    const pch = p.get('pch') || p.get('checksum')
    return (network && txid && pch) ? { network, txid, pch } : null
  }

  // legacy: network;txid;pch
  const [network, txid, pch] = raw.split(';').map(x => x.trim())
  return (network && txid && pch) ? { network, txid, pch } : null
}

async function manualFetch() {
  const raw = prompt('Paste a full URL, a query string, or network;txid;pch', localStorage.keaLastManual || '')
  if (!raw) return

  const parsed = parseManualInput(raw)
  if (!parsed) {
    log('ERROR could not parse network/txid/pch from input')
    return
  }

  localStorage.keaLastManual = raw
  saveConfig()
  await fetchTxDetail(parsed)
}

$('scanQrBtn').onclick = () => scanQr().catch(e => log(`ERROR ${e.message}`))
$('pasteQrBtn').onclick = () => pasteQr()
$('stopQrBtn').onclick = () => stopQr()
$('qrFile').onchange = e => {
  const file = e.target.files?.[0]
  if (file) readQrFile(file)
}

$('connectBtn').onclick = () => connectDoorbell()
$('testBtn').onclick = () => manualFetch().catch(e => log(`ERROR ${e.message}`))

$('verifyBtn').onclick = () => verifyDisplayedKea().catch(e => log(`ERROR ${e.message}`))
$('resetBtn').onclick = () => resetConfig()

loadConfig()
