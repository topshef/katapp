<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test index — Katomia QA</title>
<style>
  body{ font-family: system-ui, sans-serif; margin: 0 auto; max-width: 980px; padding: 24px 16px 80px; color: #222; line-height: 1.5; }
  h1{ font-size: 24px; margin-bottom: 4px; }
  h2{ font-size: 17px; margin: 28px 0 6px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
  a{ color: #2a5a78; }
  code{ background: #f4f4f4; border-radius: 4px; padding: .1em .35em; font-size: 92%; }
  .note{ color: #777; font-size: 12px; }
  .conv{ background: #eef3ff; border-left: 4px solid #4a6fd4; padding: 10px 14px; margin: 16px 0; font-size: 13px; border-radius: 0 8px 8px 0; }
  .conv b{ font-family: ui-monospace, monospace; }
  .t{ border: 1px solid #ddd; border-radius: 10px; padding: 12px 16px; margin: 10px 0; background: #fbfaf6; }
  .t h3{ margin: 0 0 2px; font-size: 15px; font-family: ui-monospace, monospace; }
  .t .ttl{ font-size: 13px; color: #444; margin-bottom: 6px; }
  .t .as{ font-size: 13px; margin: 6px 0; }
  .meta{ font-size: 12px; color: #666; margin-top: 8px; }
  .meta span{ display: inline-block; margin-right: 14px; }
  .state{ display: inline-block; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 8px; margin-left: 6px; vertical-align: 2px; }
  .state.bad{ background: #fdeaea; color: #a11; }
  .state.warn{ background: #fff3cd; color: #7a5c00; }
  .asserts{ margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; }
  .asserts li{ margin: 2px 0; }
  .asserts code{ font-weight: 600; }
  .anchor{ color:inherit; text-decoration:none }
  .anchor:hover{ text-decoration:underline }
  :target{ scroll-margin-top:12px; outline:2px solid #4a6fd4; outline-offset:6px; border-radius:8px }
  .dim{ font-size:12px; color:#5a4a2a; background:#f1ede2; display:inline-block; padding:2px 8px; border-radius:6px; margin:4px 0 2px }
  .steps{ margin:4px 0 0; padding-left:20px; font-size:12.5px }
  .steps li{ margin:2px 0 }
  .why{ background:#eef3ff; border-left:3px solid #4a6fd4; padding:6px 10px; border-radius:0 6px 6px 0 }
  .hist{ color: #666; font-size: 12px; display: block; margin-top: 2px; }
  table{ border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
  td,th{ border: 1px solid #ddd; padding: .4em .6em; text-align: left; vertical-align: top; }
  th{ background: #fafafa; }
  ul.plain{ font-size: 13px; }
</style>
</head>
<body>

<!-- Created 2026-08-08 (user): a test id must resolve to something you can open.
     MAINNETSMOKE-01 and TXS-1 were quoted in chat and could be found in neither
     the task board nor the plan doc — TXS-* existed only as prose inside another
     task's `next` field. Static viewer over data/tests.json, same pattern as the
     rest of qa/: JSON is the source of truth, HTML just displays it. -->
<h1>Test index</h1>
<p class="note">Every test id we use, what it asserts, and how to run it. Source of truth:
<code>data/tests.json</code> (git-tracked). · <a href="index.html">QA home</a> ·
<a href="kwallet.html">kWallet/signing status</a> · <a href="results.html">retest grid</a></p>

<div class="conv" id="conv"></div>

<h2>Suites</h2>
<div id="suites"><p class="note">loading…</p></div>

<h2>Expected-fail set <span class="note" id="xfAbout"></span></h2>
<div id="xfail"></div>

<h2>Not covered by automation</h2>
<ul class="plain" id="nocover"></ul>

<h2>Related tasks</h2>
<table id="tasks"><tr><th>Task</th><th>Why it's related</th></tr></table>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]))
const stateClass = s => /SILENT|ERROR|FAILED/.test(s || "") ? "bad" : "warn"
;(async () => {
  try {
    const d = await (await fetch("data/tests.json", { cache: "no-store" })).json()
    document.querySelector("#conv").innerHTML =
      `<b>Naming convention.</b> ${Object.entries(d.convention).map(([k, v]) => `<br><b>${esc(k)}</b> — ${esc(v)}`).join("")}`

    document.querySelector("#suites").innerHTML = d.suites.map(s => `
      <div class="t" id="${esc(s.id)}">
        <h3><a class="anchor" href="#${esc(s.id)}">T:${esc(s.id)}</a>${s.state ? `<span class="state ${stateClass(s.state)}">${esc((s.state.split("—")[0] || "").trim())}</span>` : ""}</h3>
        <div class="ttl">${esc(s.title || "")}</div>
        ${s.asserts ? `<div class="as">${esc(s.asserts)}</div>` : ""}
        ${s.dimension ? `<div class="dim">${esc(s.dimension)}${s.cost ? ` · <b>cost:</b> ${esc(s.cost)}` : ""}</div>` : ""}
        ${s.what_it_does ? `<div class="as"><b>What it does</b><ol class="steps">${s.what_it_does.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>` : ""}
        ${s.pass_means ? `<div class="as"><b>Pass means</b> — ${esc(s.pass_means)}</div>` : ""}
        ${s.fails_when ? `<div class="as note"><b>Fails when</b> — ${esc(s.fails_when)}</div>` : ""}
        ${s.why_it_matters ? `<div class="as why"><b>Why it matters</b> — ${esc(s.why_it_matters)}</div>` : ""}
        ${s.state ? `<div class="as note">${esc(s.state)}</div>` : ""}
        ${s.notes ? `<div class="as note">${esc(s.notes)}</div>` : ""}
        ${s.assertions ? `<ul class="asserts">${s.assertions.map(a =>
          `<li id="${esc(a.id)}"><code>T:${esc(a.id)}</code> — ${esc(a.asserts)}${a.history ? `<span class="hist">${esc(a.history)}</span>` : ""}</li>`).join("")}</ul>` : ""}
        <div class="meta">
          ${s.kind ? `<span>kind: <b>${esc(s.kind)}</b></span>` : ""}
          ${s.network ? `<span>network: <b>${esc(s.network)}</b></span>` : ""}
          ${s.schedule ? `<span>schedule: <b>${esc(s.schedule)}</b></span>` : ""}
          <br><span>harness: ${s.harness_url ? `<a href="${esc(s.harness_url)}" target="_blank"><code>${esc(s.harness)}</code></a>` : `<code>${esc(s.harness || "—")}</code>`}${s.harness_note ? ` <span class="note">— ${esc(s.harness_note)}</span>` : ""}</span>
          ${s.run ? `<br>${Object.entries(s.run).map(([k, v]) => `<span>${esc(k)}: <code>${esc(v)}</code></span>`).join("")}` : ""}
          ${s.reports ? `<br><span>reports: ${esc(s.reports)}</span>` : ""}
        </div>
      </div>`).join("")

    document.querySelector("#xfAbout").textContent = ""
    document.querySelector("#xfail").innerHTML =
      `<p class="note">${esc(d.expected_fail._about)}</p>` +
      `<table><tr><th>Id</th><th>Asserts</th><th>Stage</th><th>Status</th></tr>` +
      d.expected_fail.cases.map(c => `<tr id="${esc(c.id)}"><td><code>T:${esc(c.id)}</code>${c.runnable_by_hand ? '<br><span class="note">hand-runnable</span>' : ""}</td>` +
        `<td>${esc(c.asserts)}</td><td>${esc(c.stage)}</td><td>${esc(c.status)}</td></tr>`).join("") + `</table>`

    document.querySelector("#nocover").innerHTML = d.not_covered_by_automation.map(x => `<li>${esc(x)}</li>`).join("")
    document.querySelector("#tasks").innerHTML += Object.entries(d.related_tasks)
      .map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join("")
  } catch(e){
    document.body.insertAdjacentHTML("beforeend", `<p class="note">Failed to load: ${esc(e.message)}</p>`)
  }
})()
</script>

</body>
</html>
