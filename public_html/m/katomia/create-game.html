<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Create Katomia Game</title>

<style>

body{
  font-family:sans-serif;
  background:#f5f5f5;
  margin:20px;
}

h2{
  margin-top:0;
}

.form{
  max-width:600px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:6px;
  border:1px solid #ddd;
}

.field{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,select{
  width:100%;
  padding:8px;
  font-size:14px;
}

.explain{
  margin-top:6px;
  font-size:12px;
  color:#666;
}

.advanced{
  margin-top:20px;
  padding-top:15px;
  border-top:1px dashed #ccc;
}

button{
  margin-top:10px;
  padding:10px 16px;
  font-size:15px;
  cursor:pointer;
}

.status{
  margin-top:12px;
  font-size:13px;
}

</style>
</head>

<body>

<div class="form">

<h2>Create Game</h2>

<div class="field">
<label>Game Name</label>
<input id="gameName" placeholder="Example: demo-mainnet">
</div>


<div class="field">
<label>Network</label>
<select id="network">
<option value="playnet">Playnet</option>
<option value="testnet">Testnet</option>
<option value="mainnet">Mainnet</option>
</select>

<div class="explain" id="networkExplain"></div>
</div>


<div class="field">
<label>Visibility</label>
<select id="visibility">
<option value="public">Public</option>
<option value="unlisted">Unlisted</option>
<option value="private">Private</option>
</select>

<div class="explain" id="visibilityExplain"></div>
</div>


<div class="advanced">

<h3>Advanced Options</h3>

<div class="field">
<label>Join Rule</label>
<input id="joinRule" value="*">
<div class="explain">
Who can join the game. "*" means anyone.
Custom rules may be supported in future.
</div>
</div>


<div class="field">
<label>Lock Rule</label>
<select id="lockRule">
<option value="cluster">Cluster</option>
<option value="active">Active</option>
<option value="all">All</option>
</select>

<div class="explain" id="lockExplain"></div>
</div>

</div>


<button id="createBtn">Create Game</button>

<div class="status" id="status"></div>

</div>


<script>

const API_URL = "https://hapi2.hbar.live/live/katomia/create" // 

const explain = {

network:{
playnet:"Playnet is a sandbox network for experimenting. No Hedera transactions occur.",
testnet:"Hedera testnet. Use for testing real Hedera transactions safely.",
mainnet:"Hedera mainnet. Real transactions and fees apply."
},

visibility:{
public:"Public games appear in the game list and anyone can join.",
unlisted:"Unlisted games are hidden from listings but accessible via link.",
private:"Private games require specific permission or rules to join."
},

lock:{
cluster:"Cluster: connected groups of players who lock their trades execute together.",
active:"Active: all clusters currently active in the game must lock before execution.",
all:"All: every player in the entire game must lock before execution."
}

}

function updateExplain(){

networkExplain.textContent =
explain.network[network.value]

visibilityExplain.textContent =
explain.visibility[visibility.value]

lockExplain.textContent =
explain.lock[lockRule.value]

}

network.onchange = updateExplain
visibility.onchange = updateExplain
lockRule.onchange = updateExplain

updateExplain()


createBtn.onclick = async () => {

status.textContent = "Creating game..."

const payload = {

id: gameName.value.trim() || undefined,
network: network.value,
visibility: visibility.value,
joinRule: joinRule.value,
lockRule: lockRule.value

}

try{

const res = await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(payload)
})

const data = await res.json()

if(!data.ok){
status.textContent = "Failed to create game"
return
}

const id = data.gameId || data.game?.id

status.textContent = "Game created. Redirecting..."

window.location.href = "./game/" + id

}
catch(err){

console.error(err)
status.textContent = "Error creating game"

}

}

</script>

</body>
</html>
