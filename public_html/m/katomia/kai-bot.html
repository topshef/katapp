<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Katomia Bot 🤖</title>
</head>
<body>

<h3>Katomia Bot 🤖</h3>
<div id="log"></div>

<script>
function  log(...args){
  console.log(...args)

  const html = args.map(a => {
    if(typeof a === "object"){
      return "<pre>" + JSON.stringify(a, null, 2) + "</pre>"
    }
    return String(a)
  }).join(" ")

  document.getElementById("log").innerHTML += html + "<br>"
}

// --- CONFIG
const gameId = new URLSearchParams(location.search).get("game")
const WS_URL = "wss://hapi2.hbar.live/live/ws"

// --- BOT STATE
function getOrCreateBotToken(){

  let token = localStorage.getItem("katomiaBotToken")

  if(!token){
    token = crypto.randomUUID()
    localStorage.setItem("katomiaBotToken", token)
  }

  return token
}

const playerToken = getOrCreateBotToken()


//const botAccount = "0.0.6029941"
const botAccount = "0.0.3039988"

const rewarded = new Set()

let socket
let myPlayerId = null

function connect(){

  socket = new WebSocket(WS_URL)

  socket.onopen = () => {
    log("🟢 connected")

    // ✅ FIX: match real client exactly
    socket.send(JSON.stringify({
      type: "game_join",
      gameId,
      playerToken,
      playerName: "🤖"
    }))

    socket.send(JSON.stringify({
      type: "game_addAccount",
      gameId,
      playerToken,
      label: botAccount
    }))
  }

  socket.onmessage = e => {
    const msg = JSON.parse(e.data)

    console.log("BOT RECEIVED:", msg)

    // ✅ FIX: correct message type
    
    if(msg.type !== "game_state") return
    if(!msg.myPlayerId) return
    myPlayerId = msg.myPlayerId

    handleState(msg.state)
  }

  socket.onerror = err => {
    console.error("WS ERROR", err)
    log("❌ ws error")
  }

  socket.onclose = () => {
    log("🔴 disconnected")
  }
}

function getConnectedCluster(state, startAccountId){

  const visited = new Set()
  const stack = [startAccountId]

  while(stack.length){
    const id = stack.pop()
    if(visited.has(id)) continue
    visited.add(id)

    const acc = state.accounts[id]
    if(!acc) continue

    // edges: basket links
    acc.basket?.forEach(item => {
      const fromId = item.fromAccountId || item.fromId || item.from
      if(fromId && !visited.has(fromId))
        stack.push(fromId)
    })

    // reverse edges (who points to this)
    Object.values(state.accounts).forEach(other => {
      other.basket?.forEach(item => {
        const fromId = item.fromAccountId || item.fromId || item.from
        if(fromId === id && !visited.has(other.id))
          stack.push(other.id)
      })
    })
  }

  return [...visited]
}

function shouldBotLock(state){

  const myAccountId = myPlayerId + ":" + botAccount
  const myAcc = state.accounts[myAccountId]
  if(!myAcc) return false

  const cluster = getConnectedCluster(state, myAccountId)

  // only consider cluster if there's actually a trade
  if(cluster.length <= 1) return false

  const others = cluster.filter(id => {
    const acc = state.accounts[id]
    return acc && acc.playerId !== myPlayerId
  })

  if(!others.length) return false

  const allLocked = others.every(id => state.accounts[id].mode === "lock")

  log("LOCK CHECK", { cluster, others, allLocked })

  return allLocked && myAcc.mode !== "lock"
}

function sendLock(){
  const payload = {
    type: "game_toggleLock",
    gameId,
    accountId: myPlayerId + ":" + botAccount
  }

  log("🔒 BOT LOCKING", payload)
  socket.send(JSON.stringify(payload))
}

function handleState(state){

  const accounts = Object.values(state.accounts || {})

  accounts.forEach(acc => {

    if(acc.playerId === myPlayerId) return

    const basket = acc.basket || []
    if(!basket.length) return

    basket.forEach(item => {

      const fromId = item.fromAccountId || item.fromId || item.from
      if(!fromId) return

      if(fromId.split(":")[0] === myPlayerId){
        console.log("skip self-origin reward", { fromId, item })
        return
      }

      // prevent duplicates per sender
      //if(rewarded.has(fromId)) return
      const key = fromId + "|" + item.assetId + "|" + acc.id

      if(rewarded.has(key)) return

      const amount = item.amount || 0
      if(amount <= 0){
        console.log("skip zero basket item", item)
        return
      }

      log("🎁 rewarding sender", { fromId, to: acc.id, item })

      reward(fromId)

      rewarded.add(key)
    })
  })


  // --- AUTO LOCK LOGIC ---
  if(shouldBotLock(state)){
    sendLock()
  }
}


function reward(targetId){
  if(!myPlayerId) return

  const payload = {
    type: "game_offer",
    gameId,
    fromId: myPlayerId + ":" + botAccount,
    toId: targetId,
    assetId: "0.0.456858",
    amount: 50000
  }
  console.log({targetId, payload})
  socket.send(JSON.stringify(payload))
}

connect()
</script>

</body>
</html>
