<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="katomia.css">


<title>Katomia markets 🍎🥬🥕</title>

<style>
* {
  -webkit-tap-highlight-color: transparent;
}


/* see above imported css todo organiase*/
body{
  zzfont-family:sans-serif;  
  margin:20px;
  background:#f5f5f5;
  color:#333;
}

h2{
  margin-top:0;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  background:white;
  border-radius:8px;
  overflow:hidden;
}

.grid-header{
  font-weight:600;
  font-size:14px;
  padding:10px 12px;
  background:#fafafa;
  border-bottom:1px solid #e5e5e5;
}

.row{
  display:contents;
}

.cell{
  padding:10px 12px;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.row:hover .cell{
  background:#fafafa;
}

.cell a{
  text-decoration:none;
  color:#0366d6;
  font-weight:600;
}

.cell a:hover{
  text-decoration:underline;
}

.create-market{
  display:inline-block;
  margin-top:18px;
  padding:10px 16px;
  background:#28a745;
  color:white;
  text-decoration:none;
  font-weight:600;
  border-radius:6px;
  transition:all .15s ease;
}

.create-market:hover{
  background:#218838;
}

/* MOBILE */

@media (max-width:700px){

  .grid{
    display:block;
    background:transparent;
  }

  .grid-header{
    display:none;
  }

  .row{
    display:block;
    background:white;
    margin-bottom:12px;
    border-radius:8px;
    overflow:hidden;
  }

  .cell{
    display:flex;
    justify-content:space-between;
    padding:10px 12px;
    border-bottom:1px solid #eee;
  }



  .cell:last-child{
    border-bottom:none;
  }

  .cell::before{
    font-weight:600;
    color:#666;
    margin-right:10px;
  }

  .cell::before{
    content:attr(data-label);
    font-weight:600;
    color:#666;
    margin-right:10px;
  }
  
}

.grid-header{
  font-weight:600;
  font-size:14px;
  padding:10px 12px;
  background:#fafafa;
  border-bottom:1px solid #e5e5e5;
}


.cell.gamename{
  min-width: 24ch;
  max-width: 48ch;
}

</style>
</head>

<body>

<h2>Choose a Katomia market... 🍎🥬🥕</h2>

<div id="games" class="grid"></div>

<div>
  <a class="create-market" href="./create">
    <i class="fa-solid fa-plus"></i> Create your own market
  </a>
</div>

<script>

const API_URL = "/m/katomia/hapi/games"
//const API_URL = "https://hapi2.hbar.live/live/katomia/games"

const displayLookup = {
  tradingMode: {
    proposal: "💡 Proposal",
    orderBook: "📊 Order Book"
  },

  network: {
    playnet: "🧸 Playnet",
    testnet: "🟠 Testnet",
    mainnet: "🟣 Mainnet"
  },

  visibility: {
    public:   "🌍 Public",
    unlisted: "🔗 Unlisted",
    private:  "🔒 Private"
  },
  
  lockRule: {
    cluster: "☆ cluster",
    active:  "☆☆ active",
    all:     "🌍 all"
  }, 
  
  joinRule: {
    '*': "🙌 anyone",
  },
}

function displayValue(group, value){
  return displayLookup[group]?.[value] || value || ""
}


function formatJoinRule(rule){

  if(typeof rule === "string") return rule

  if(rule && rule.rule){
    return rule.rule + "(" + rule.params.join(",") + ")"
  }

  return ""
}

const columns = [

  {
    key:"id",
    label:"ID",
    render:g => `<a href="./game/${g.id}" target="${g.id}">${g.id}</a>`
  },

  {
    key:"gamename",
    label:"Name",
    render:g => g.profile?.name || ""
  },

  {
    key:"network",
    label:"Network",
    render:g => displayValue("network", g.config?.network || g.network)
  },

  {
    key:"visibility",
    label:"Visibility",
    render:g => displayValue("visibility", g.config?.visibility || g.visibility)
  },

  {
    key:"join",
    label:"Join rule",
    render:g => displayValue("joinRule", g.config?.joinRule ?? g?.joinRule)
  },

  {
    key:"trading",
    label:"Trading mode",
    render:g => displayValue("tradingMode", g.config?.tradingMode)
  },

  {
    key:"lock",
    label:"Lock rule",
    render:g => displayValue("lockRule", g.config?.lockRule || g.lockRule)
  },

  {
    key:"strike",
    label:"Strike delay",
    render:g => formatStrike(g.config?.txDelaySeconds)
  }

]

function formatStrike(seconds){
  seconds = Number(seconds) || 0

  if(seconds === 0) return "⚡ Instant"

  const h = Math.floor(seconds / 3600)
  const m = Math.floor(seconds % 3600 / 60)
  const s = seconds % 60

  if(h > 0) return `⏱️ ${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`

  if(m > 0) return `⏱️ ${m}:${String(s).padStart(2,'0')}`

  return `⏱️ ${s}s`
}

async function loadGames(){

  const res = await fetch(API_URL)
  const data = await res.json()

  if(!data.ok) return

  const container = document.getElementById("games")

  container.style.gridTemplateColumns = `repeat(${columns.length},1fr)`

  container.insertAdjacentHTML(
    "beforeend",
    columns
      .map(c => `<div class="grid-header">${c.label}</div>`)
      .join("")
  )

  Object.values(data.games).forEach(g => {

    container.insertAdjacentHTML(
      "beforeend",
      `
      <div class="row">
        ${
          columns
            .map(c=>`
              <div class="cell ${c.key}" data-label="${c.label}">
                ${c.render(g)}
              </div>
            `)
            .join("")
        }
      </div>
      `
    )

  })

}

loadGames()

</script>

<script>
fetch("./footer.html")
  .then(r => r.text())
  .then(html => {
    document.body.insertAdjacentHTML("beforeend",html)
  })
</script>

</body>
</html>
