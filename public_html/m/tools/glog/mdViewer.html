<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      max-width: 800px;
      margin: 2em auto;
      padding: 0 1em;
      line-height: 1.6;
    }
    h1 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 0.3em;
    }
  </style>
</head>
<body>
  <!-- <h1 id="heading">Loading...</h1> -->
  <div id="content">Loading...</div>

  <script>

    /* requires the following htaccess code to redirect md files:

        RewriteEngine On

        # 1) If request is for *.md AND has ?raw=1 → serve the real markdown
        RewriteCond %{REQUEST_URI} \.md$
        RewriteCond %{QUERY_STRING} (^|&)raw=1($|&)
        RewriteRule ^ - [L]

        # 2) If request is for *.md (and NOT raw=1) → show HTML viewer
        RewriteRule ^(.+)\.md$ mdViewer.html [L,QSA]

    */

    // If URL ends with .md, use that; otherwise fall back to index.md
    let mdFile = 'index.md'

    const match = location.pathname.match(/([^/]+\.md)$/)
    if (match) mdFile = match[1]

    //const baseName = mdFile.replace(/\.md$/, '')

    document.title = mdFile
    //console.log('Will fetch:', mdFile)

    //fetch(mdFile)
    fetch(mdFile + '?raw=1')
      .then(res => res.text())
      .then(md => {
        content.innerHTML = marked.parse(md)
      })
      .catch(err => {
        content.innerText = 'Failed to load ' + mdFile + ': ' + err
      })
      
  </script>
</body>
</html>
