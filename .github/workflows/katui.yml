# katui — the static katomia bundle on Cloudflare Workers (katapp: deploys as katui-lab1 on
# lab1.katomia.com, named by build/variant.env — KATAPP-SPLIT1).
#
#   router   — route map + Worker contract over build/dist (node, no deps, no network)
#   fresh    — rebuilds build/dist from the repo with the runner's php and fails if the
#              committed dist is stale: dist is a checked-in artifact (the git-connected
#              Cloudflare deploy ships it as-is), so a source edit without a rebuild would
#              silently deploy the old page. Run build/build-static.sh and commit.
#   sign     — SIGN-PRECHECK-QA1: drives the built signing modal (build/dist) in headless
#              Chromium and proves every "not enough" the backend's precheck can report —
#              fungible shortfall, HBAR shortfall, missing association (soft and hard), an
#              NFT the sender no longer holds — rings the right card red, marks the chip,
#              explains itself in the card's detail, and never leaves the header on "Ready
#              to submit". Plus the clean / incomplete / expired controls. Fixture-driven,
#              no network: qa/sign/run.mjs. Born of the 2026-09-06 case where an unowned
#              serial left every card green and the modal claiming readiness.
#   board    — BOARD-REGRESSION1: drives the built game board (build/dist, ?demo=1 — a local
#              reducer behind a fake socket, no backend) in headless Chromium. The Round
#              Table's baseline facts (ring16 default, hub, chip census, uniform counter
#              bands, the skin dropdown) and the Carousel's contract (two stripes, centre
#              strip, a real drag → amount modal → Offer lands in the basket, the signing
#              countdown in the centre strip, the conveyor moves and its ⟳ stops it). Born
#              with CAROUSEL1 on the operator's condition that a second board shape must not
#              break the first: qa/board/run.mjs.
#   smoke    — after a push, waits for the Cloudflare build then curls the live routes
#              (the 404s this whole exercise started with). Origin comes from the
#              repository VARIABLE KATUI_ORIGIN (Settings → Secrets and variables →
#              Actions → Variables), default the workers.dev preview host.
name: katui
on:
  push:
    branches: [main, lab1, 'claude/**', 'ccr-**']   # KATAPP-SPLIT1: katapp's trunk is main; lab1 deploys lab1.katomia.com
    paths: [build/**, public_html/**, qa/sign/**, qa/board/**, .github/workflows/katui.yml]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      origin:
        description: site origin to smoke-test (overrides KATUI_ORIGIN)
        required: false

jobs:
  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node build/router.test.mjs
      - run: node build/router.e2e.mjs

  fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: php available?
        run: php -v | head -1
      - name: committed dist == rebuilt dist (modulo mtime cache stamps + commit hash)
        run: bash build/dist-fresh.sh

  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa/sign/package-lock.json
      - name: install
        working-directory: qa/sign
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: SIGN-PRECHECK-QA1
        run: node qa/sign/run.mjs

  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa/board/package-lock.json
      - name: install
        working-directory: qa/board
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: BOARD-REGRESSION1
        run: node qa/board/run.mjs

  smoke:
    runs-on: ubuntu-latest
    needs: [router]
    env:
      ORIGIN: ${{ inputs.origin || vars.KATUI_ORIGIN || 'https://lab1.katomia.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: wait for the Cloudflare git-connected build
        if: github.event_name == 'push'
        run: sleep 120
      - run: bash build/smoke.sh "$ORIGIN"
